<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phần 1 - Form đơn giản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .form-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: white;
        }
        button[type="reset"] {
            background-color: #6c757d;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Thông Tin Cá Nhân</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Nhập email" required>
        </div>

        <div class="form-group">
            <label>Sở thích:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
            </div>
        </div>

        <div class="btn-container">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>
</div>

</body>
</html>
